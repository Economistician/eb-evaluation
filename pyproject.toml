######################################
# Project metadata
######################################
[project]
name = "eb-evaluation"
version = "0.2.10"
description = "Electric Barometer: DataFrame-based evaluation utilities for CWSL and related metrics."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE*"]

authors = [
  { name = "Kyle Corrie (Economistician)", email = "kcorrie@economistician.com" }
]

keywords = [
  "electric-barometer",
  "forecast-evaluation",
  "asymmetric-loss",
  "readiness",
  "forecasting",
  "pandas",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

######################################
# Core runtime dependencies
######################################
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",

  # Electric Barometer System Release 0.2.10 pins
  "eb-metrics==0.2.9",
  "eb-adapters==0.2.5",
]

######################################
# Project URLs
######################################
[project.urls]
Homepage = "https://github.com/Economistician/eb-evaluation"
Repository = "https://github.com/Economistician/eb-evaluation"
Issues = "https://github.com/Economistician/eb-evaluation/issues"
Documentation = "https://github.com/Economistician/eb-docs"

######################################
# Optional dependencies (extras)
######################################
[project.optional-dependencies]

# CI / test-only dependencies
test = [
  "pytest>=8.0",
]

# Local developer tooling
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

# Optional "boosting engines" commonly used in the AutoEngine zoo.
# These are intentionally extras because they can be heavy / platform-specific.
boosting = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
]

# Combined extra to satisfy the "extras: all" CI contract.
# Aggregates optional test + dev tooling + optional engines.
all = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
]

######################################
# Build system
######################################
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

######################################
# Package discovery
######################################
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eb_evaluation = ["py.typed"]

######################################
# Pytest configuration
######################################
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "scale: multi-million-row throughput benchmarks (7k nodes × 15 series × 28-day window)",
]
